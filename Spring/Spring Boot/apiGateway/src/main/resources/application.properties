spring.application.name=apiGateway

server.port=8082

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

#eureka.client.register-with-eureka=true
#eureka.client.fetch-registry=true

spring.cloud.gateway.server.webflux.routes[0].id=cart
spring.cloud.gateway.server.webflux.routes[0].uri=lb://cart
spring.cloud.gateway.server.webflux.routes[0].predicates=Path=/api/v1/order/**

spring.cloud.gateway.server.webflux.routes[1].id=payment
spring.cloud.gateway.server.webflux.routes[1].uri=lb://payment
spring.cloud.gateway.server.webflux.routes[1].predicates=Path=/payment/order/**
